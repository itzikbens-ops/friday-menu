<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בחירת תפריט ארוחת שישי משפחתית</title>
    <!-- טעינת ספרייה להמרת אלמנט HTML לתמונה -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        h2 {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 12px;
        }
        .family-selector {
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .family-selector select {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            margin-right: 10px;
            cursor: pointer;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9fbfb;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .menu-item label {
            cursor: pointer;
            font-size: 16px;
            flex-grow: 1;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .admin-panel {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 30px;
        }
        .admin-panel h3 {
            margin-top: 0;
            font-size: 16px;
            color: #2d3748;
        }
        .admin-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 14px;
        }
        .btn {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #c53030;
        }
        .btn-add {
            background-color: #3182ce;
            margin-top: 10px;
            width: 100%;
        }
        .btn-add:hover {
            background-color: #2b6cb0;
        }
        .btn-image {
            background-color: #319795;
            width: 100%;
            margin-top: 10px;
            font-size: 15px;
            padding: 10px;
        }
        .btn-image:hover {
            background-color: #2c7a7b;
        }
        .btn-delete {
            background-color: #e28743;
            padding: 4px 8px;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #c06929;
        }
        input[type="text"] {
            padding: 8px;
            width: 100%;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .summary {
            background: #e6fffa;
            border: 1px solid #b2f5ea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .summary h3 {
            margin: 0;
            color: #234e52;
            font-size: 16px;
        }
        .summary-date {
            font-size: 13px;
            color: #2c7a7b;
            font-weight: bold;
        }
        ul {
            margin: 0;
            padding-right: 20px;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍽️ ארוחת שישי משפחתית</h1>
    <div class="subtitle">בחרו את המנות המועדפות עליכם לשבוע הנגיש!</div>

    <!-- בחירת משתמש -->
    <div class="family-selector">
        <label for="family-member"><b>מי בוחר עכשיו?</b></label>
        <select id="family-member" onchange="changeUser()">
            <!-- יטענו אוטומטית מטעינת הדף -->
        </select>
    </div>

    <!-- רשימת בחירת מנות -->
    <div class="section">
        <h2 id="section-title">בחר מנות מהתפריט:</h2>
        <div id="menu-list">
            <!-- המנות יטענו כאן אוטומטית -->
        </div>
    </div>

    <!-- סיכום בחירות (מוגדר כאזור לצילום תמונה) -->
    <div class="summary" id="capture-area">
        <div class="summary-header">
            <h3>📋 סיכום הבחירות של כל בני המשפחה:</h3>
            <span id="current-date-display" class="summary-date"></span>
        </div>
        <ul id="selected-list">
            <li>טרם נבחרו מנות.</li>
        </ul>
        <button class="btn btn-image" onclick="downloadSummaryImage()">📸 צור ושמור כתמונה</button>
    </div>

    <!-- אזור ניהול (למנהל בלבד) -->
    <div class="admin-panel">
        <h3>⚙️ אזור ניהול (עבורך)</h3>
        
        <div style="margin-bottom: 15px;">
            <label style="font-size:14px; display:block; margin-bottom:5px;"><b>ניהול מנות בתפריט:</b></label>
            <div id="admin-menu-manager" style="max-height: 180px; overflow-y: auto; margin-bottom: 10px;">
                <!-- רשימת מנות לניהול ומחיקה -->
            </div>
            <input type="text" id="new-item-name" placeholder="הוסף מנה חדשה לרשימה..." style="margin-bottom:8px;">
            <button class="btn btn-add" onclick="addMenuItem()">הוסף מנה</button>
        </div>

        <button class="btn" onclick="resetSelections()" style="width: 100%;">🔄 איפוס כל הבחירות לשבוע חדש</button>
    </div>
</div>

<script>
    // רשימת בני המשפחה המקורית
    let familyMembers = ["אדל","אופק","אורין","אפרת","הראל","סיגל","עלמה","ענבל","פזית","רז"];

    // רשימת המנות המקורית
    let defaultMenu = [
        "מרק צח עם קניידלך",
        "דג סלמון בתנור",
        "עוף צלוי בתנור עם תפוחי אדמה",
        "אורז לבן חגיגי",
        "שעועית ירוקה שום ושקדים",
        "צלי בקר עם פטריות",
        "תפוחי אדמה אפויים קריספיים"
    ];

    // טעינת נתונים מהזיכרון המקומי
    let menuItems = JSON.parse(localStorage.getItem('family_menu_items_flat')) || defaultMenu;
    let allSelections = JSON.parse(localStorage.getItem('family_menu_all_selections_flat')) || {};
    let currentUser = familyMembers[0];

    function initPage() {
        const selectElem = document.getElementById('family-member');
        selectElem.innerHTML = '';
        familyMembers.forEach(member => {
            const option = document.createElement('option');
            option.value = member;
            option.textContent = member;
            selectElem.appendChild(option);
        });
        selectElem.value = currentUser;

        // הצגת התאריך הנוכחי בצד שמאל של כותרת הסיכום
        const today = new Date();
        const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
        document.getElementById('current-date-display').textContent = today.toLocaleDateString('he-IL', options);

        renderMenu();
        renderAdminManager();
        renderSummary();
    }

    function changeUser() {
        const selectElem = document.getElementById('family-member');
        currentUser = selectElem.value;
        renderMenu();
    }

    function renderMenu() {
        document.getElementById('section-title').textContent = `שלום ${currentUser}, בחר את המנות שלך:`;
        const menuContainer = document.getElementById('menu-list');
        menuContainer.innerHTML = '';

        if (!allSelections[currentUser]) {
            allSelections[currentUser] = {};
        }

        menuItems.forEach((item, index) => {
            const isChecked = allSelections[currentUser][item] ? 'checked' : '';
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `
                <label for="item-${index}">${item}</label>
                <input type="checkbox" id="item-${index}" ${isChecked} onclick="toggleSelection('${item}', this.checked)">
            `;
            menuContainer.appendChild(div);
        });
    }

    function toggleSelection(item, isChecked) {
        if (!allSelections[currentUser]) {
            allSelections[currentUser] = {};
        }
        allSelections[currentUser][item] = isChecked;
        localStorage.setItem('family_menu_all_selections_flat', JSON.stringify(allSelections));
        renderSummary();
    }

    function renderAdminManager() {
        const adminManager = document.getElementById('admin-menu-manager');
        adminManager.innerHTML = '';

        menuItems.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'admin-item-row';
            row.innerHTML = `
                <span>${item}</span>
                <button class="btn btn-delete" onclick="deleteMenuItem(${index})">מחק</button>
            `;
            adminManager.appendChild(row);
        });
    }

    function addMenuItem() {
        const input = document.getElementById('new-item-name');
        const newItemName = input.value.trim();

        if (newItemName && !menuItems.includes(newItemName)) {
            menuItems.push(newItemName);
            localStorage.setItem('family_menu_items_flat', JSON.stringify(menuItems));
            input.value = '';
            renderMenu();
            renderAdminManager();
        }
    }

    function deleteMenuItem(index) {
        const itemToDelete = menuItems[index];
        if (confirm(`האם למחוק את המנה "${itemToDelete}" מהתפריט?`)) {
            menuItems.splice(index, 1);
            localStorage.setItem('family_menu_items_flat', JSON.stringify(menuItems));
            
            for (let member in allSelections) {
                if (allSelections[member][itemToDelete]) {
                    delete allSelections[member][itemToDelete];
                }
            }
            localStorage.setItem('family_menu_all_selections_flat', JSON.stringify(allSelections));

            renderMenu();
            renderAdminManager();
            renderSummary();
        }
    }

    function renderSummary() {
        const selectedContainer = document.getElementById('selected-list');
        selectedContainer.innerHTML = '';
        
        let hasSelections = false;
        let summaryHTML = '';

        familyMembers.forEach(member => {
            const memberSelections = allSelections[member] || {};
            const chosenItems = Object.keys(memberSelections).filter(item => memberSelections[item]);

            if (chosenItems.length > 0) {
                hasSelections = true;
                summaryHTML += `<li><b>${member}:</b> ${chosenItems.join(', ')}</li>`;
            }
        });

        if (!hasSelections) {
            selectedContainer.innerHTML = '<li>טרם נבחרו מנות על ידי בני המשפחה.</li>';
            return;
        }

        selectedContainer.innerHTML = summaryHTML;
    }

    // פונקציה לייצור ושמירת תמונה בלבד
    function downloadSummaryImage() {
        const containerElement = document.getElementById('capture-area');
        
        html2canvas(containerElement, { scale: 2 }).then(canvas => {
            const imageURL = canvas.toDataURL('image/png');
            
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = `Friday_Menu_${new Date().toISOString().slice(0,10)}.png`;
            downloadLink.click();
        }).catch(error => {
            console.error("שגיאה בייצור התמונה:", error);
            alert("אירעה שגיאה בייצור התמונה. אנא נסה שוב.");
        });
    }

    function resetSelections() {
        if (confirm('האם אתה בטוח שברצונך לאפס את כל בחירות בני המשפחה לקראת שבוע חדש?')) {
            allSelections = {};
            localStorage.removeItem('family_menu_all_selections_flat');
            renderMenu();
            renderSummary();
        }
    }

    initPage();
</script>

</body>
</html>
